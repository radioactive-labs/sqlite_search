name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# Publishing to RubyGems happens from a laptop (rake release:publish). This
# workflow only cuts the GitHub Release from the tag once it lands, so it can
# never race the local gem push.
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build gem
        run: gem build sqlite_search.gemspec

      # The notes are this version's CHANGELOG section, as reviewed and committed
      # by rake release:prepare (git-cliff output plus any hand edits).
      - name: Extract release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v head="## [$version]" '
            /^## \[/ { if (found) exit; found = index($0, head) == 1; next }
            found
          ' CHANGELOG.md > RELEASE_NOTES.md
          test -s RELEASE_NOTES.md || { echo "No CHANGELOG.md section for $version"; exit 1; }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: sqlite_search-*.gem
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
