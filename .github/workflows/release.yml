name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# Publishing to RubyGems happens from a laptop (rake release:publish). This
# workflow only cuts the GitHub Release from the tag once it lands, so it can
# never race the local gem push.
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build gem
        run: gem build sqlite_search.gemspec

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: sqlite_search-*.gem
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
